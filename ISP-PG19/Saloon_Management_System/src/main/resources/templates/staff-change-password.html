<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Salon Harshi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--surface-container-low);
        }
        .auth-card {
            background: var(--surface);
            width: 100%;
            max-width: 500px;
            padding: 3rem;
            border-radius: 2.5rem;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(233, 30, 99, 0.1);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .auth-header h1 {
            font-size: 2.2rem;
            color: var(--on-surface);
            margin-bottom: 0.5rem;
        }
        .error-msg {
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: -15px;
            margin-bottom: 15px;
            display: block;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 2rem;
            color: var(--on-surface-variant);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: color 0.3s;
        }
        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="serif">Security <span class="italic" style="color: var(--primary);">Update</span></h1>
            <p style="color: var(--on-surface-variant); font-size: 0.9rem;">Keep your staff account protected.</p>
        </div>

        <form th:action="@{/staff/change-password}" th:object="${passwordForm}" method="post">

            <label for="currentPassword" class="form-label">Current Password</label>
            <input type="password" th:field="*{currentPassword}" id="currentPassword" class="form-control" placeholder="••••••••" required>
            <span th:if="${#fields.hasErrors('currentPassword')}" class="error-msg" th:errors="*{currentPassword}"></span>

            <label for="newPassword" class="form-label">New Password</label>
            <input type="password" th:field="*{newPassword}" id="newPassword" class="form-control" placeholder="Enter new password" required>
            <span th:if="${#fields.hasErrors('newPassword')}" class="error-msg" th:errors="*{newPassword}"></span>

            <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
            <input type="password" th:field="*{confirmNewPassword}" id="confirmNewPassword" class="form-control" placeholder="Repeat new password" required>
            <span th:if="${#fields.hasErrors('confirmNewPassword')}" class="error-msg" th:errors="*{confirmNewPassword}"></span>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;">Update Password</button>
        </form>

        <a th:href="@{/staff/profile}" class="back-link">← Return to Profile</a>
    </div>
</div>

</body>
</html>
