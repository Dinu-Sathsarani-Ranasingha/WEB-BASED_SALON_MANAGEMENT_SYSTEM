<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Salon Harshi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Standalone Authentication Layout */
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-container-low);
            padding: 2rem;
        }
        .auth-card {
            background: var(--surface);
            width: 100%;
            max-width: 450px;
            padding: 3rem;
            border-radius: 2rem;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(233, 30, 99, 0.08);
        }
        .auth-header { text-align: center; margin-bottom: 2.5rem; }
        .auth-header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--on-surface); }
        .auth-header h1 .italic { font-style: italic; color: var(--primary); }
        .auth-header p { color: var(--on-surface-variant); font-size: 0.95rem; }

        /* Error Styling */
        .error {
            color: #e91e63;
            font-size: 0.8rem;
            margin-top: -15px;
            margin-bottom: 15px;
            display: block;
            font-weight: 600;
        }

        /* Link Styling */
        .auth-links { text-align: center; margin-top: 2rem; font-size: 0.85rem; }
        .auth-links a { color: var(--primary); text-decoration: none; font-weight: 700; transition: all 0.3s; }
        .auth-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Reset <span class="italic">Password</span></h1>
            <p>Secure your account with a new password.</p>
        </div>

        <form th:action="@{/customer/reset-password}" th:object="${resetForm}" method="post">

            <label for="username" class="form-label">Username</label>
            <input type="text" th:field="*{username}" id="username" class="form-control" placeholder="Enter your username" required />
            <span th:if="${#fields.hasErrors('username')}" class="error" th:errors="*{username}"></span>

            <label for="newPassword" class="form-label">New Password</label>
            <input type="password" th:field="*{newPassword}" id="newPassword" class="form-control" placeholder="New password" required />
            <span th:if="${#fields.hasErrors('newPassword')}" class="error" th:errors="*{newPassword}"></span>

            <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
            <input type="password" th:field="*{confirmNewPassword}" id="confirmNewPassword" class="form-control" placeholder="Confirm new password" required />
            <span th:if="${#fields.hasErrors('confirmNewPassword')}" class="error" th:errors="*{confirmNewPassword}"></span>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Reset Password</button>
        </form>

        <div class="auth-links">
            <p><a th:href="@{/login}">← Back to Login</a></p>
        </div>
    </div>
</div>

</body>
</html>
