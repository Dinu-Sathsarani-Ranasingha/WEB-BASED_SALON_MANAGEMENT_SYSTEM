<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Salon Harshi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--surface-container-low); padding: 2rem; }
        .auth-card { background: var(--surface); width: 100%; max-width: 600px; padding: 3.5rem; border-radius: 2rem; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.04); border: 1px solid rgba(233, 30, 99, 0.08); }
        .auth-header { text-align: center; margin-bottom: 2.5rem; }
        .auth-header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .auth-header h1 .italic { font-style: italic; color: var(--primary); }
        .auth-header p { color: var(--on-surface-variant); font-size: 0.95rem; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .full-width { grid-column: 1 / -1; }
        .auth-links { text-align: center; margin-top: 2rem; font-size: 0.85rem; }
        .auth-links a { color: var(--primary); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Create <span class="italic">Account</span></h1>
            <p>Join the atelier and book your first experience.</p>
        </div>

        <form th:action="@{/register}" method="post" th:object="${customer}">
            <div class="form-grid">
                <div class="full-width">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" name="name" th:value="*{name}" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="full-width">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" th:value="*{email}" class="form-control" placeholder="your.email@example.com" required>
                </div>

                <div>
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" th:value="*{username}" class="form-control" required>
                </div>

                <div>
                    <label for="phoneNumber" class="form-label">Phone Number</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" th:value="*{phoneNumber}" class="form-control" pattern="[0-9]{10}" placeholder="10 digits" required>
                </div>

                <div class="full-width">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Create a strong password" required>
                </div>

                <div class="full-width">
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register Now</button>
                </div>
            </div>
        </form>

        <div class="auth-links">
            <p>Already have an account? <a th:href="@{/login}">Sign in here</a></p>
        </div>
    </div>
</div>
</body>
</html>
