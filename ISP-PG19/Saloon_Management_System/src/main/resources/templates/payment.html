<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Secure Payment | Salon Harshi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .main-content { margin-left: 260px; padding: 4rem; background-color: var(--background); min-height: 100vh; display: flex; align-items: center; justify-content: center; }

        .payment-card { background: var(--surface); width: 100%; max-width: 500px; padding: 4rem; border-radius: 2.5rem; box-shadow: 0 12px 32px rgba(0,0,0,0.04); border: 1px solid rgba(233,30,99,0.08); }
        .payment-header { text-align: center; margin-bottom: 2.5rem; }
        .payment-header h1 { font-size: 2.2rem; margin-bottom: 0.5rem; color: var(--on-surface); }
        .payment-header h1 .italic { font-style: italic; color: var(--primary); }

        .amount-display { background: var(--surface-container-low); padding: 1.5rem; text-align: center; font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: var(--primary); border-radius: 1.5rem; margin-bottom: 2.5rem; border: 1px dashed var(--outline); }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    </style>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="main-content">
    <div class="payment-card">
        <div class="payment-header">
            <span class="form-label" style="color:var(--primary);">Secure Checkout</span>
            <h1>Payment <span class="italic">Details</span></h1>
        </div>

        <div class="amount-display" id="displayAmount">LKR 0.00</div>

        <form id="paymentForm">
            <label class="form-label">Card Number</label>
            <input type="text" id="cardNumber" class="form-control" placeholder="0000 0000 0000 0000" maxlength="16" required pattern="\d{16}">

            <div class="form-row">
                <div>
                    <label class="form-label">Expiry</label>
                    <input type="text" id="expiry" class="form-control" placeholder="MM/YY" required pattern="(0[1-9]|1[0-2])\/\d{2}">
                </div>
                <div>
                    <label class="form-label">CVV</label>
                    <input type="password" id="cvv" class="form-control" placeholder="***" maxlength="3" required pattern="\d{3}">
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; padding: 1.2rem;">Complete Payment</button>
        </form>
    </div>
</main>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const apptId = urlParams.get('id');
    const amount = urlParams.get('amount');

    if (amount) {
        document.getElementById('displayAmount').innerText = `LKR ${parseFloat(amount).toFixed(2)}`;
    }

    document.getElementById('paymentForm').onsubmit = async (e) => {
        e.preventDefault();
        const payload = {
            cardNumber: document.getElementById('cardNumber').value,
            expiryDate: document.getElementById('expiry').value,
            cvv: document.getElementById('cvv').value
        };

        const res = await fetch(`/api/appointments/${apptId}/pay`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert("Payment Successful!");
            window.location.href = "/appointments/my-history"; // FIXED URL
        } else {
            alert("Payment failed: " + await res.text());
        }
    };
</script>
</body>
</html>
